      /* Floating Keyframes */
      @keyframes float-center {
        0%, 100% { transform: translate(-50%, -50%); }

      }
      @keyframes float-br {
        0%, 100% { transform: translate(0, 0); }

      }

      .animate-float-center { animation: float-center 6s ease-in-out infinite; }
      .animate-float-tl { animation: float-tl 7s ease-in-out infinite; }
      .animate-float-tr { animation: float-tr 6.5s ease-in-out infinite 0.5s; }

      /* ---------------------------------------------------- */
      /* LOADING ANIMATION STYLES                             */
      /* ---------------------------------------------------- */
      :root {
        --primary: #f9a825;
        --primary-dark: #f57f17;
        --accent: #ffcc33;
      }

      /* Hide loader when page is loaded */
      body.loaded #loader {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px);
      }

      /* Main loader container */
      #loader {
        position: fixed;
        inset: 0;
        background: #0b0f19;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease, transform 0.6s ease;
      }

      /* Inner container */
      .loader-inner {
        text-align: center;
      }

      /* Logo wrapper with glow effect */
      .loader-logo-wrap {
        background: #ffffff;
        border-radius: 999px;
        padding: 0.9rem;
        box-shadow: 0 15px 60px rgba(245, 158, 11, 0.4);
        margin-bottom: 1.25rem;
        display: inline-block;
      }

      /* Logo image */
      .loader-logo {
        height: 90px;
        width: 90px;
        border-radius: 999px;
        object-fit: contain;
        display: block;
      }

      /* Animation container */
      .loader-animation {
        position: relative;
        width: 130px;
        height: 130px;
        margin: 0 auto;
      }

      /* Base arc styling */
      .loader-animation .arc {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--primary);
        border-right-color: var(--primary);
      }

      /* Second arc (reverse spin) */
      .loader-animation .arc-2 {
        inset: 20px;
        border-top-color: var(--accent);
        border-left-color: var(--accent);
        animation: spin-reverse 1.5s linear infinite;
      }

      /* Third arc (slower spin) */
      .loader-animation .arc-3 {
        inset: 28px;
        border-top-color: #ffffff;
        border-right-color: #ffffff;
        opacity: 0.6;
        animation: spin 1.8s linear infinite;
      }

      /* First arc (normal spin) */
      .loader-animation .arc-1 {
        animation: spin 1.2s linear infinite;
      }

      /* Plane icon that orbits */
      .loader-animation .plane {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: -18px -18px;
        animation: orbit 1.6s linear infinite;
        color: #ffffff;
        font-size: 1.2rem;
      }

      /* Keyframe animations */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes spin-reverse {
        to { transform: rotate(-360deg); }
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }
