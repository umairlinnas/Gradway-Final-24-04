<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradway | Migration Simplified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
      @import url(https://fonts.googleapis.com/css?family=Google+Sans+Text:400,500,700|Google+Sans:400,500,700);
      
      html {
        font-family: 'Plus Jakarta Sans', 'Google Sans', sans-serif;
        font-size: 14px;
        color-scheme: light;
        background: #FAFAFA;
        color: #1A1F2C;
      }
      body {
        overflow-x: hidden;
        scroll-behavior: smooth;
        letter-spacing: 0.02em;
        word-spacing: 0.15em;
        margin: 0;
      }
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.01em;
        word-spacing: 0.1em;
      }
      p, span, label, input, textarea, select {
        word-spacing: 0.12em;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #ffffff;
        border-radius: 20px;
        margin-block: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
        border: 2px solid #ffffff;
      }

      /* Floating Keyframes */
      @keyframes float-center {
        0%, 100% { transform: translate(-50%, -50%); }
        50% { transform: translate(-50%, -52%); }
      }
      @keyframes float-tl {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(12px, -15px); }
      }
      @keyframes float-tr {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-15px, 12px); }
      }
      @keyframes float-bl {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(15px, 15px); }
      }
      @keyframes float-br {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-10px, -20px); }
      }

      .animate-float-center { animation: float-center 6s ease-in-out infinite; }
      .animate-float-tl { animation: float-tl 7s ease-in-out infinite; }
      .animate-float-tr { animation: float-tr 6.5s ease-in-out infinite 0.5s; }
      .animate-float-bl { animation: float-bl 8s ease-in-out infinite 1s; }
      .animate-float-br { animation: float-br 7.5s ease-in-out infinite 1.5s; }

      .hero-bubble {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        aspect-ratio: 1 / 1;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                    box-shadow 0.6s ease, 
                    border-radius 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                    border-color 0.4s ease;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.5);
        will-change: transform, border-radius;
        box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08), 0 12px 24px -4px rgba(0, 0, 0, 0.1);
        touch-action: manipulation;
        border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%;
        background: white;
      }
      
      .hero-bubble:hover, .hero-bubble:active {
        transform: scale(1.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        border-color: rgba(251, 191, 36, 0.8);
        z-index: 60;
        border-radius: 50% !important;
      }

      .hero-bubble-center:hover, .hero-bubble-center:active {
        transform: translate(-50%, -50%) scale(1.05) !important;
      }

      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      .hero-pattern {
        background-image: radial-gradient(#fbbf24 0.5px, transparent 0.5px);
        background-size: 24px 24px;
        mask-image: linear-gradient(to bottom, black, transparent);
      }

      .btn-submit {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-submit:hover {
        background-color: #3b82f6 !important;
      }
      
      /* Animation Utilities */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* ---------------------------------------------------- */
      /* LOADING ANIMATION STYLES                             */
      /* ---------------------------------------------------- */
      :root {
        --primary: #f9a825;
        --primary-dark: #f57f17;
        --accent: #ffcc33;
      }

      /* Hide loader when page is loaded */
      body.loaded #loader {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px);
      }

      /* Main loader container */
      #loader {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 1.1s ease, transform .7s ease;
      }

      /* Inner container */
      .loader-inner {
        text-align: center;
      }

      /* Logo wrapper with glow effect */
      .loader-logo-wrap {
        background: #ffffff;
        border-radius: 999px;
        padding: .9rem .9rem;
        box-shadow: 0 15px 90px rgba(255, 166, 0, 0.35);
        margin-bottom: 1.25rem;
      }

      /* Logo image */
      .loader-logo {
        height: 110px;
        border-radius: 999px;
        width: auto;
        display: block;
      }

      /* Animation container */
      .loader-animation {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 0 auto;
      }

      /* Base arc styling */
      .loader-animation .arc {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--primary);
        border-right-color: var(--primary);
      }

      /* Second arc (reverse spin) */
      .loader-animation .arc-2 {
        inset: 20px;
        border-top-color: var(--accent);
        border-left-color: var(--accent);
        animation: spin-reverse 1.5s linear infinite;
      }

      /* Third arc (slower spin) */
      .loader-animation .arc-3 {
        inset: 30px;
        border-top-color: #ffffff;
        border-right-color: #ffffff;
        opacity: 0.6;
        animation: spin 1.8s linear infinite;
      }

      /* First arc (normal spin) */
      .loader-animation .arc-1 {
        animation: spin 1.2s linear infinite;
      }

      /* Plane icon that orbits */
      .loader-animation .plane {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: -20px -20px;
        animation: orbit 1.6s linear infinite;
        color: #ffffff;
        font-size: 1.2rem;
      }

      /* Keyframe animations */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes spin-reverse {
        to { transform: rotate(-360deg); }
      }

      @keyframes orbit {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '"Google Sans"', 'sans-serif'],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "clsx": "https://esm.sh/clsx@2.1.1",
    "tailwind-merge": "https://esm.sh/tailwind-merge@2.5.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "motion/react": "https://esm.sh/motion@12.0.0/react",
    "motion/": "https://esm.sh/motion@^12.23.26/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@/": "./"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#FAFAFA] text-slate-800 antialiased">
    <!-- LOADING ANIMATION START -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-logo-wrap">
          <!-- Used online URL for logo to ensure visibility in this environment -->
          <img src="https://media.licdn.com/dms/image/v2/D560BAQGirGJH6oI0AQ/company-logo_200_200/B56ZvAb6d1IYAM-/0/1768460102510?e=2147483647&v=beta&t=t76ITNGe8KPVlum51ou1M6C_TbF3bXIllV1rY6r9OUo" alt="Gradway logo" class="loader-logo" />
        </div>
        <div class="loader-animation">
          <span class="arc arc-1"></span>
          <span class="arc arc-2"></span>
          <span class="arc arc-3"></span>
          <span class="plane"><i class="fa-solid fa-plane-up"></i></span>
        </div>
      </div>
    </div>
    <!-- LOADING ANIMATION END -->

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <script>
      window.addEventListener("load", () => {
        // Small delay to ensure brand impact
        setTimeout(() => {
            document.body.classList.add("loaded");
        }, 800);
      });
    </script>
</body>
</html>
